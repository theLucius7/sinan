[package]
name = "sinan-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The panel binary assembles the host with the compiled business plugins.
# Migrations stay here as one linear sequence shared by the host and plugins.
[dependencies]
sinan-panel-host.workspace = true
sinan-plugin-singbox.workspace = true
sinan-plugin-ddns.workspace = true
sinan-plugin-alicloud.workspace = true
sinan-protocol.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sinan-compiler.workspace = true
sinan-adapter-singbox.workspace = true
blake2.workspace = true
sinan-adapter-nodequality.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
sinan-agent-core.workspace = true
sinan-adapter-sdk.workspace = true
uuid.workspace = true
rand.workspace = true
sha2.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
tar = "0.4"
flate2 = "1"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rusqlite = { version = "0.32", features = ["bundled"] }
